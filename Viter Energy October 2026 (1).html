<style>
  :root {
    --bg:#0b0f18;--surface:#131928;--surface2:#1a2236;--border:#252f45;
    --accent:#3b7ff5;--accent2:#6c3df5;--green:#22c55e;--amber:#f59e0b;
    --red:#ef4444;--cyan:#22d3ee;--text:#e8edf7;--muted:#7a8aaa;
    --purple:#a78bfa;--promoted:#f59e0b;--halo:#a78bfa;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'Inter','Segoe UI',system-ui,sans-serif;min-height:100vh;font-size:14px}
  .topnav{position:sticky;top:0;z-index:100;background:rgba(11,15,24,.96);border-bottom:1px solid var(--border);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:0 28px;height:56px}
  .topnav .logo{font-weight:800;font-size:15px;letter-spacing:.04em;color:var(--accent);margin-right:8px;display:flex;align-items:center;gap:8px}
  .topnav .logo span{color:var(--text);font-weight:500}
  .topnav .report-title{font-size:13px;color:var(--muted)}
  .topnav .spacer{flex:1}
  .topnav .timestamp{font-size:11px;color:var(--muted);background:var(--surface2);border-radius:6px;padding:4px 10px;border:1px solid var(--border)}
  .launch-badge{font-size:10px;font-weight:700;letter-spacing:.05em;background:linear-gradient(135deg,#3b7ff522,#3b7ff544);color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:3px 10px;text-transform:uppercase}
  .tab-bar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:0;padding:0 28px;overflow-x:auto}
  .tab-btn{padding:14px 18px;font-size:13px;font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
  .tab-btn:hover{color:var(--text)}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab-content{display:none}
  .tab-content.active{display:block}
  .page{padding:28px;max-width:1440px;margin:0 auto}
  .section{margin-bottom:32px}
  .section-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .section-title::after{content:'';flex:1;height:1px;background:var(--border)}
  .hero-header{background:linear-gradient(135deg,var(--surface) 0%,#1a2540 100%);border:1px solid var(--border);border-radius:14px;padding:24px 28px;margin-bottom:24px;display:flex;align-items:center;gap:24px}
  .hero-header h1{font-size:24px;font-weight:800}
  .hero-header .sub{font-size:13px;color:var(--muted);margin-top:4px}
  .hero-header .dsp-pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cyan);background:#22d3ee15;border:1px solid #22d3ee44;border-radius:20px;padding:4px 12px;margin-top:8px;display:inline-block}
  .hero-header .accent-line{width:4px;height:56px;background:linear-gradient(to bottom,var(--accent),var(--accent2));border-radius:4px;flex-shrink:0}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;transition:border-color .2s}
  .kpi-card:hover{border-color:var(--accent)}
  .kpi-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
  .kpi-value{font-size:24px;font-weight:800;line-height:1;color:var(--text)}
  .kpi-value.accent{color:var(--accent)}
  .kpi-value.green{color:var(--green)}
  .kpi-value.amber{color:var(--amber)}
  .kpi-sub{font-size:11px;color:var(--muted);margin-top:4px}
  .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .chart-grid.three{grid-template-columns:1fr 1fr 1fr}
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
  .chart-card.full{grid-column:1/-1}
  .chart-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:16px}
  .chart-container{position:relative}
  .chart-container.tall{height:300px}
  .chart-container.short{height:220px}
  .chart-container.xtall{height:380px}
  .data-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:auto}
  .data-table{width:100%;border-collapse:collapse;border-spacing:0;font-size:12px;table-layout:auto}
  .data-table thead{position:sticky;top:0;z-index:2}
  .data-table thead tr{background:var(--surface2)}
  .data-table th{
    padding:10px 16px;
    text-align:left;
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    border-bottom:2px solid var(--border);
    border-right:1px solid var(--border);
    white-space:nowrap;
    vertical-align:middle;
  }
  .data-table th:last-child{border-right:none}
  .data-table td{
    padding:10px 16px;
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
    color:var(--text);
    vertical-align:middle;
    white-space:nowrap;
  }
  .data-table td:last-child{border-right:none}
  .data-table tbody tr:last-child td{border-bottom:none}
  .data-table tbody tr:hover td{background:var(--surface2)}
  .data-table th.num{text-align:right}
  .num{text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .good{color:var(--green)}
  .accent-c{color:var(--accent)}
  .amb{color:var(--amber)}
  .tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px}
  .tag-promoted{background:#f59e0b22;color:var(--promoted);border:1px solid #f59e0b44}
  .tag-halo{background:#a78bfa22;color:var(--halo);border:1px solid #a78bfa44}
  .insight-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
  .insight-card{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:16px}
  .insight-card.g{border-left-color:var(--green)}
  .insight-card.a{border-left-color:var(--amber)}
  .insight-card.r{border-left-color:var(--red)}
  .insight-card .il{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
  .insight-card .iv{font-size:22px;font-weight:800;color:var(--text)}
  .insight-card .id{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}
  .callout{margin-top:12px;padding:14px 16px;background:var(--surface2);border-radius:8px;font-size:12px;color:var(--muted);line-height:1.6}
  .prod-cell{max-width:320px;white-space:normal;word-break:break-word;line-height:1.4}
  .data-table td.prod-cell{white-space:normal}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  @media(max-width:900px){.chart-grid,.chart-grid.three,.insight-grid{grid-template-columns:1fr}.chart-card.full{grid-column:1}}
</style>
</head>
<body>

<nav class="topnav">
  <div class="logo">SP <span>SellerPlex</span></div>
  <div class="report-title">Viter Energy — October 2026 DSP EOM Report</div>
  <div class="spacer"></div>
  <div class="launch-badge">🧩 Full Month Active</div>
  <div class="timestamp">Campaign Period: October 1–31, 2026</div>
</nav>

      <tbody id="snAsinTbody"></tbody>
    </table></div>
    <div class="callout" style="border-left:3px solid var(--cyan);margin-top:14px"><strong style="color:var(--text)">💡 Takeaway:</strong> ${topAsin?`<strong>${topAsin.asin}</strong> leads with ${fmt(topAsin.snss)} sign-ups. `:''}SnSS rate is ${fmtPct(k.snss_rate,1)} of attributed purchases this month versus ${fmtPct(km.snss_rate,1)} in ${M.prev_month}; cost per sign-up moved from ${fmtC(km.cost_per_snss)} to ${fmtC(k.cost_per_snss)}.</div>
  </div>

  <div class="section">
    <div class="section-title">Month-over-Month</div>
    <div class="data-table-wrap"><table class="data-table">
      <thead><tr><th>Metric</th><th class="num">${M.prev_month}</th><th class="num">${M.month}</th><th class="num">Change</th></tr></thead>
      <tbody id="snMomTbody"></tbody>
    </table></div>
  </div>`;

  orders.forEach(o=>{
    $('snOrderTbody').insertAdjacentHTML('beforeend', `<tr><td class="prod-cell" style="max-width:340px;font-size:12px" title="${esc(o.order)}">${esc(o.order)}</td><td class="num">${fmtC0(o.cost)}</td><td class="num">${fmt(o.purchases)}</td><td class="num good">${fmt(o.snss)}</td><td class="num">${fmt(o.snss_promoted)}</td><td class="num">${fmtPct(o.pct_of_snss,0)}</td><td class="num">${fmtPct(o.snss_rate,1)}</td><td class="num">${o.cost_per_snss!==null?fmtC(o.cost_per_snss):'—'}</td></tr>`);
  });
  sn.asins.forEach((a,i)=>{
    $('snAsinTbody').insertAdjacentHTML('beforeend', `<tr><td class="rank" style="font-weight:700;color:${MU}">#${i+1}</td><td style="font-family:monospace;font-size:11px;color:${C}">${a.asin}</td><td class="prod-cell" style="font-size:12px;max-width:320px">${esc(a.product||'—')}</td><td><span style="color:${a.type==='Promoted'?AM:P};font-weight:600">${a.type}</span></td><td class="num good">${fmt(a.snss)}</td><td class="num">${fmt(a.snss_promoted)}</td><td class="num">${fmt(a.purchases)}</td><td class="num">${fmtPct(a.snss_rate,1)}</td><td class="num">${fmtC0(a.sales)}</td></tr>`);
  });
  const mom = [
    ['Total SnSS', km.snss, k.snss, fmt, false],
    ['Promoted SnSS', km.snss_promoted, k.snss_promoted, fmt, false],
    ['Brand halo SnSS', km.snss_halo, k.snss_halo, fmt, false],
    ['Total purchases', km.purchases, k.purchases, fmt, false],
    ['SnSS rate', km.snss_rate, k.snss_rate, v=>fmtPct(v,2), false],
    ['Ad spend', km.cost, k.cost, fmtC0, false],
    ['Cost per SnSS', km.cost_per_snss, k.cost_per_snss, fmtC, true],
  ];
  mom.forEach(([n,a,b,f,inv])=>{
    const pct = a ? (b-a)/Math.abs(a)*100 : null;
    const good = pct===null ? true : (inv ? pct<=0 : pct>=0);
    $('snMomTbody').insertAdjacentHTML('beforeend', `<tr><td>${n}</td><td class="num">${f(a)}</td><td class="num">${f(b)}</td><td class="num" style="color:${good?'var(--green)':'var(--red)'};font-weight:700">${pct===null?'—':(pct>=0?'+':'')+pct.toFixed(0)+'%'}</td></tr>`);
  });

  const dts = daily.map(d=>shortDate(d.date));
  new Chart($('cSn1'), {type:'bar', data:{labels:dts, datasets:[
    {label:'Promoted SnSS', data:daily.map(d=>d.promoted), backgroundColor:'#f59e0b88', borderColor:AM, borderWidth:1, stack:'s'},
    {label:'Brand Halo SnSS', data:daily.map(d=>d.snss-d.promoted), backgroundColor:'#a78bfa88', borderColor:P, borderWidth:1, stack:'s'},
  ]}, options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'top', labels:{boxWidth:10,padding:12}}}, scales:{x:{stacked:true}, y:{stacked:true, grid:{color:'#252f4566'}, ticks:{precision:0}}}}});
  new Chart($('cSn2'), {type:'doughnut', data:{labels:[`Promoted (${fmt(k.snss_promoted)})`,`Brand Halo (${fmt(k.snss_halo)})`], datasets:[{data:[k.snss_promoted,k.snss_halo], backgroundColor:['#f59e0baa','#a78bfa88'], borderColor:[AM,P], borderWidth:2}]}, options:{responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{legend:{position:'bottom', labels:{padding:14,boxWidth:12}}}}});
  const oc = orders.filter(o=>o.snss>0);
  new Chart($('cSn3'), {type:'bar', data:{labels:oc.map(o=>short(o.order).slice(0,60)), datasets:[{label:'Total SnSS', data:oc.map(o=>o.snss), backgroundColor:'#22c55e88', borderColor:G, borderWidth:1}]},
    options:{indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{grid:{color:'#252f4566'}, ticks:{precision:0}}}}});
  } catch(e){ console.error("Section render error:", e); }
})();
</script>
</body>
</html>
